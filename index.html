<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>语伴 AI · 你的外语学习伙伴</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fc;--panel:#fff;
  --sidebar:#1e1b2e;--sidebar-hover:#2d2845;--sidebar-active:#3d3660;
  --border:#e8eaf0;--border2:#d1d5e0;
  --text:#1a1d2e;--text2:#6b7080;--text3:#a0a6b8;
  --accent:#7c3aed;--accent-h:#6d28d9;--accent-light:#f0ebff;--accent-glow:rgba(124,58,237,.18);
  --user-bubble-from:#7c3aed;--user-bubble-to:#8b5cf6;
  --danger:#ef4444;--green:#10b981;
  --think-bg:#fffbeb;--think-border:#fbbf24;
  --shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.1);
  --radius:14px;--sidebar-w:256px;
}
.dark{
  --bg:#0f0d1a;--panel:#1a1728;
  --sidebar:#0d0b16;--sidebar-hover:#1e1b2e;--sidebar-active:#2d2845;
  --border:#252236;--border2:#302d45;
  --text:#e8e4f8;--text2:#8b8aaa;--text3:#4a4870;
  --accent-light:#2d1f4a;--accent-glow:rgba(124,58,237,.25);
  --user-bubble-from:#6d28d9;--user-bubble-to:#7c3aed;
  --think-bg:#1e1a0e;--think-border:#92400e;
  --shadow:0 2px 12px rgba(0,0,0,.3);--shadow-lg:0 8px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;font-size:15px;transition:background .25s,color .25s}

/* ══ SIDEBAR ══ */
#sidebar{width:var(--sidebar-w);background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:10}
#sidebar.hidden{transform:translateX(-100%);width:0;overflow:hidden}
#sidebar-brand{padding:20px 16px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(124,58,237,.4);flex-shrink:0}
.brand-name{font-size:15px;font-weight:700;color:#fff}
.brand-sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:1px}
#sidebar-top{padding:12px 10px 6px;display:flex;flex-direction:column;gap:7px}
#new-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,255,255,.8);font-size:13px;font-family:inherit;cursor:pointer;transition:.15s;width:100%}
#new-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.sb-search{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.sb-search input{border:none;outline:none;background:transparent;font-size:13px;color:rgba(255,255,255,.7);flex:1;font-family:inherit}
.sb-search input::placeholder{color:rgba(255,255,255,.25)}
#conv-list{flex:1;overflow-y:auto;padding:4px 8px}
#conv-list::-webkit-scrollbar{width:3px}
#conv-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.conv-group-label{font-size:10px;color:rgba(255,255,255,.25);padding:12px 8px 5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.conv-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:.12s;margin-bottom:2px}
.conv-item:hover{background:var(--sidebar-hover)}
.conv-item.active{background:var(--sidebar-active)}
.conv-item .ci-title{flex:1;font-size:13px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item.active .ci-title{color:#fff}
.conv-item .ci-del{opacity:0;color:rgba(255,255,255,.25);font-size:16px;cursor:pointer;padding:1px 4px;border-radius:4px;flex-shrink:0}
.conv-item:hover .ci-del{opacity:1}
.conv-item .ci-del:hover{color:#ef4444}
#sidebar-footer{padding:10px 10px 14px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:2px}
.sf-btn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.4);transition:.12s;user-select:none}
.sf-btn:hover{background:var(--sidebar-hover);color:rgba(255,255,255,.75)}

/* ══ MAIN ══ */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
#toggle-sidebar{background:none;border:none;cursor:pointer;color:var(--text2);padding:6px;border-radius:8px;display:flex;align-items:center;transition:.12s}
#toggle-sidebar:hover{background:var(--accent-light);color:var(--accent)}
#topbar-center{flex:1;display:flex;align-items:center;gap:8px;overflow:hidden}
#topbar-title{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang-badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;background:var(--accent-light);color:var(--accent);white-space:nowrap;flex-shrink:0;border:1px solid rgba(124,58,237,.2)}
.tb-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--border2);border-radius:9px;cursor:pointer;color:var(--text2);padding:6px 12px;font-size:12px;font-family:inherit;transition:.15s;white-space:nowrap}
.tb-btn:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
/* CALL BUTTON in topbar */
#call-btn{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:9px;cursor:pointer;color:#fff;padding:7px 14px;font-size:12px;font-weight:600;font-family:inherit;transition:.15s;white-space:nowrap;box-shadow:0 3px 10px rgba(16,185,129,.3)}
#call-btn:hover{background:linear-gradient(135deg,#059669,#047857);transform:scale(1.03)}

#mode-bar{display:flex;gap:5px;padding:10px 20px 8px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
#mode-bar::-webkit-scrollbar{display:none}
.mode-btn{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;background:transparent;color:var(--text2);transition:.15s;white-space:nowrap}
.mode-btn:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px var(--accent-glow)}

/* ══ MESSAGES ══ */
#messages{flex:1;overflow-y:auto;padding:28px 0 12px;scroll-behavior:smooth;background:var(--bg)}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.msg-wrap{max-width:780px;margin:0 auto;padding:0 24px}
#welcome{padding:16px 0 28px}
.welcome-hero{text-align:center;padding:36px 24px;background:var(--panel);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:24px}
.welcome-logo-ring{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 24px rgba(124,58,237,.35)}
.welcome-hero h1{font-size:24px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
.welcome-hero h1 span{background:linear-gradient(135deg,#7c3aed,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome-hero p{color:var(--text2);font-size:14px;line-height:1.65;margin-bottom:18px}
.call-cta{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:24px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;box-shadow:0 4px 16px rgba(16,185,129,.35);transition:.15s;margin-bottom:16px}
.call-cta:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(16,185,129,.4)}
.lang-pills{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.lang-pill{font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;background:var(--accent-light);color:var(--accent);border:1px solid rgba(124,58,237,.15)}
.sug-section-label{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
.sug-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.sug-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:.18s;background:var(--panel);box-shadow:var(--shadow)}
.sug-card:hover{border-color:var(--accent);background:var(--accent-light);transform:translateY(-1px);box-shadow:0 4px 16px var(--accent-glow)}
.sc-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sc-icon{font-size:17px}
.sc-title{font-size:13px;font-weight:600;color:var(--text)}
.sc-sub{font-size:12px;color:var(--text2);line-height:1.45}

/* MSG ROWS */
.msg-group{margin-bottom:20px;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-user{display:flex;justify-content:flex-end;gap:10px;align-items:flex-end;margin-bottom:4px}
.user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.user-bubble{background:linear-gradient(135deg,var(--user-bubble-from),var(--user-bubble-to));color:#fff;padding:11px 16px;border-radius:18px 18px 4px 18px;font-size:15px;line-height:1.65;max-width:82%;word-break:break-word;white-space:pre-wrap;box-shadow:0 4px 14px rgba(124,58,237,.28)}
.msg-ai{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:flex-start;margin-bottom:4px}
.ai-av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(124,58,237,.3);flex-shrink:0;margin-top:2px}
.ai-content-wrap{background:var(--panel);border:1px solid var(--border);border-radius:18px 18px 18px 4px;padding:14px 18px;box-shadow:var(--shadow);min-width:0;word-break:break-word}
.ai-body{font-size:15px;line-height:1.78;color:var(--text)}
.ai-body p{margin-bottom:10px}.ai-body p:last-child{margin-bottom:0}
.ai-body strong{font-weight:600}.ai-body em{font-style:italic;color:var(--accent)}
.ai-body ul,.ai-body ol{padding-left:22px;margin-bottom:10px}.ai-body li{margin-bottom:5px;line-height:1.6}
.ai-body h3{font-size:15px;font-weight:600;color:var(--accent);margin:14px 0 6px}
.ai-body h2{font-size:17px;font-weight:600;margin:14px 0 6px}
.ai-body blockquote{border-left:3px solid var(--accent);padding:8px 14px;color:var(--text2);margin:10px 0;background:var(--accent-light);border-radius:0 10px 10px 0}
.ai-body table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;border-radius:8px;overflow:hidden}
.ai-body th,.ai-body td{border:1px solid var(--border);padding:9px 13px;text-align:left}
.ai-body th{background:var(--accent-light);font-weight:600;color:var(--accent);font-size:13px}
.ai-body code{background:var(--accent-light);color:var(--accent);border:1px solid rgba(124,58,237,.15);padding:1px 6px;border-radius:5px;font-size:13px;font-family:'SF Mono','Consolas',monospace}
.code-block-wrap{margin:12px 0;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.code-header{display:flex;align-items:center;justify-content:space-between;background:#1e1b2e;padding:8px 14px}
.code-lang{font-size:12px;color:#a78bfa;font-weight:600;font-family:monospace}
.copy-code-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#a0a6b8;cursor:pointer;font-size:11px;padding:3px 9px;border-radius:6px;font-family:inherit;transition:.12s}
.copy-code-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.ai-body pre{background:#0f0d1a;color:#e2e0f0;padding:16px;font-size:13px;font-family:'SF Mono','Consolas',monospace;overflow-x:auto;line-height:1.65;margin:0}
.ai-body pre code{background:none;border:none;padding:0;color:inherit}
.think-block{border:1px solid var(--think-border);border-radius:10px;margin-bottom:14px;overflow:hidden;background:var(--think-bg)}
.think-header{display:flex;align-items:center;gap:8px;padding:8px 13px;cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:#92400e;transition:.12s}
.dark .think-header{color:#fbbf24}
.think-header:hover{opacity:.8}
.think-arrow{margin-left:auto;font-size:10px;transition:transform .2s;opacity:.5}
.think-arrow.open{transform:rotate(180deg)}
.think-body{padding:0 13px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s}
.think-body.open{max-height:400px;padding:6px 13px 12px}
.think-body p{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:4px}
.msg-actions{display:flex;gap:3px;margin-top:8px;opacity:0;transition:.15s}
.msg-group:hover .msg-actions{opacity:1}
.ma-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px 8px;border-radius:7px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:3px;font-family:inherit;transition:.12s}
.ma-btn:hover{background:var(--accent-light);color:var(--accent)}
.attach-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;justify-content:flex-end}
.attach-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:6px 11px;font-size:12px;color:#fff}
.typing-indicator{display:flex;gap:5px;padding:8px 2px;align-items:center}
.typing-indicator span{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.5;animation:tblink 1.3s infinite;display:inline-block}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes tblink{0%,60%,100%{opacity:.25;transform:scale(.75)}30%{opacity:.9;transform:scale(1)}}

/* ══ INPUT ══ */
#input-area{padding:12px 20px 16px;flex-shrink:0;background:var(--bg);border-top:1px solid var(--border)}
#input-box{max-width:780px;margin:0 auto;background:var(--panel);border:1.5px solid var(--border2);border-radius:18px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s;overflow:hidden}
#input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow),var(--shadow)}
#attach-preview-bar{display:none;flex-wrap:wrap;gap:7px;padding:10px 14px 0}
#attach-preview-bar.show{display:flex}
.ap-chip{display:flex;align-items:center;gap:6px;background:var(--accent-light);border:1px solid rgba(124,58,237,.2);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--accent)}
.ap-chip-rm{background:none;border:none;cursor:pointer;color:var(--accent);font-size:14px;line-height:1;padding:0 2px;margin-left:2px;opacity:.6;transition:.12s}
.ap-chip-rm:hover{opacity:1}
#input-row{display:flex;align-items:flex-end;gap:8px;padding:10px 12px}
#input{flex:1;border:none;outline:none;background:transparent;font-size:15px;font-family:inherit;color:var(--text);resize:none;min-height:26px;max-height:180px;line-height:1.6;padding:0}
#input::placeholder{color:var(--text3)}
.ib-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:6px;border-radius:9px;display:flex;align-items:center;transition:.15s;flex-shrink:0}
.ib-btn:hover{background:var(--accent-light);color:var(--accent)}
#file-input{display:none}
#mic-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:6px;border-radius:9px;display:flex;align-items:center;transition:.15s;flex-shrink:0;position:relative}
#mic-btn:hover{background:var(--accent-light);color:var(--accent)}
#mic-btn.recording{color:#fff;background:var(--danger);animation:mic-pulse .9s infinite}
@keyframes mic-pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
#send-btn{width:38px;height:38px;border-radius:11px;border:none;background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;box-shadow:0 4px 12px rgba(124,58,237,.35)}
#send-btn:hover{transform:scale(1.05)}
#send-btn:disabled{background:var(--border2);box-shadow:none;transform:none;cursor:default}
#stop-btn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--border2);background:none;color:var(--text2);cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
#stop-btn:hover{background:var(--accent-light);color:var(--danger);border-color:var(--danger)}
#input-footer{max-width:780px;margin:6px auto 0;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
#input-hint{font-size:11px;color:var(--text3)}
#voice-status{font-size:11px;color:var(--danger);font-weight:500;display:none}
#voice-status.show{display:block}

/* ══ CALL MODAL ══ */
#call-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  backdrop-filter:blur(16px);z-index:200;
  display:none;align-items:center;justify-content:center;
}
#call-overlay.show{display:flex}
#call-panel{
  width:360px;max-width:92vw;
  background:linear-gradient(160deg,#1e1b2e,#0f0d1a);
  border:1px solid rgba(124,58,237,.3);
  border-radius:28px;padding:40px 32px 36px;
  text-align:center;
  box-shadow:0 24px 64px rgba(0,0,0,.6),0 0 0 1px rgba(124,58,237,.15);
}
.call-avatar-ring{
  width:96px;height:96px;border-radius:28px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:20px;position:relative;
  box-shadow:0 12px 36px rgba(124,58,237,.5);
}
.call-avatar-ring.speaking{animation:avatar-pulse 1.2s ease-in-out infinite}
@keyframes avatar-pulse{0%,100%{box-shadow:0 12px 36px rgba(124,58,237,.5),0 0 0 0 rgba(124,58,237,.4)}50%{box-shadow:0 12px 36px rgba(124,58,237,.7),0 0 0 16px rgba(124,58,237,0)}}
.call-avatar-ring.listening{animation:avatar-listen 1s ease-in-out infinite}
@keyframes avatar-listen{0%,100%{box-shadow:0 12px 36px rgba(239,68,68,.5),0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 12px 36px rgba(239,68,68,.7),0 0 0 14px rgba(239,68,68,0)};background:linear-gradient(135deg,#ef4444,#f97316)}
#call-name{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px}
#call-status{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:6px;min-height:20px}
#call-lang-select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:7px 12px;font-size:13px;color:#fff;font-family:inherit;outline:none;cursor:pointer;margin-bottom:24px;width:100%}
#call-lang-select option{background:#1e1b2e;color:#fff}

/* Waveform bars */
#waveform{display:flex;align-items:center;justify-content:center;gap:4px;height:40px;margin-bottom:24px}
.wave-bar{width:4px;border-radius:3px;background:rgba(124,58,237,.4);transition:height .1s}
.wave-bar.active{background:linear-gradient(to top,#7c3aed,#a855f7)}

/* Transcript area */
#call-transcript{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:14px;margin-bottom:24px;
  min-height:64px;max-height:120px;overflow-y:auto;
  font-size:13px;color:rgba(255,255,255,.7);
  line-height:1.6;text-align:left;
}
#call-transcript::-webkit-scrollbar{width:3px}
#call-transcript::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.transcript-you{color:#a78bfa;font-weight:500}
.transcript-ai{color:rgba(255,255,255,.8)}

/* Call controls */
#call-controls{display:flex;align-items:center;justify-content:center;gap:16px}
.ctrl-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;transition:.15s;user-select:none;
}
.ctrl-btn-icon{
  width:52px;height:52px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;

<script>
// ── STATE ──
let convs=JSON.parse(localStorage.getItem('yuban_convs')||'[]');
let activeId=null,history=[],attachments=[],busy=false;
let settings=JSON.parse(localStorage.getItem('yuban_settings')||'{}');
let currentMode='general';

// Speech
let recognition=null,isRecording=false;
let synth=window.speechSynthesis;
let callActive=false,callMuted=false,speakerOn=true;
let callRecognition=null,callBusy=false;
let waveInterval=null;

const AI_AV=`<div class="ai-av"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-4l-4 4v-4z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;

const MODES={
  general:{label:'💬 自由对话',hint:'💬 自由对话 · Enter发送 · 🎙️麦克风 · 📞通话模式',placeholder:'用任何语言提问，或直接用外语和我对话…',
    prompt:`你是「语伴AI」，专门服务外语学习者的智能语言学习伙伴，支持英、日、韩、法、西班牙语等多语种。先用<think>标签写2-3句分析思路，再给出结构清晰、举例丰富的正式回答。`},
  correct:{label:'✍️ 语法纠错',hint:'✍️ 语法纠错 · 输入或说出你写的外语句子',placeholder:'粘贴你写的英语/日语/韩语句子，我帮你纠错…',
    prompt:`你是「语伴AI」语法纠错专家。先用<think>分析错误，然后按格式输出：## 🔍 纠错报告\n**原文：** xxx\n**修正后：** xxx\n### 错误详情\n| 序号 | 错误 | 正确 | 说明 |\n### 💡 学习建议`},
  translate:{label:'🔄 翻译解析',hint:'🔄 翻译解析 · 输入或说出要翻译的内容',placeholder:'输入想翻译的句子（支持任意语言互译）…',
    prompt:`你是「语伴AI」翻译解析专家。先用<think>分析语言和难点，然后输出：## 🔄 翻译结果\n**原文：** xxx\n**译文：** xxx\n### 📐 句子结构\n### 💎 关键词汇\n| 词汇 | 词性 | 含义 | 用法 |\n### 🌟 表达技巧`},
  speak:{label:'🗣️ 口语练习',hint:'🗣️ 口语练习 · 推荐使用📞通话模式来练习！',placeholder:'告诉我想练习的语言和场景，例如：练习英语购物对话…',
    prompt:`你是「语伴AI」口语练习教练。先用<think>设计场景策略，然后扮演角色用目标语言对话。每次用户回复后：继续对话，在末尾用【语言点】标注可改进的表达，给出更地道说法。`},
  vocab:{label:'📖 词汇讲解',hint:'📖 词汇讲解 · 输入不懂的单词或词组',placeholder:'输入想学的单词、词组或短语（任何语言）…',
    prompt:`你是「语伴AI」词汇讲解专家。先用<think>分析学习重点，然后输出：## 📖 [词汇]\n**基本释义：** xxx\n### 🎯 核心用法\n[3-5个例句中外对照]\n### ⚠️ 易混淆词\n### 🌍 文化/语境提示\n### 📝 记忆技巧`},
  culture:{label:'🌏 文化背景',hint:'🌏 文化背景 · 探索语言背后的文化世界',placeholder:'问任何关于语言文化的问题…',
    prompt:`你是「语伴AI」跨文化交际专家。先用<think>分析文化核心，然后结合例子解答，对比中文母语者可能的文化误解，给出实用建议，语气亲切生动。`}
};

// ══ INIT ══
function init(){
  applySettings();
  buildWaveform();
  initSpeechRecognition();
  if(convs.length>0)loadConv(convs[0].id);else showWelcome();
  renderSidebar();
  document.getElementById('input').placeholder=MODES[currentMode].placeholder;
}

function applySettings(){
  if(settings.dark)document.body.classList.add('dark');
  if(settings.fontSize)document.body.style.fontSize=settings.fontSize+'px';
  document.getElementById('dark-toggle').classList.toggle('on',!!settings.dark);
  if(settings.fontSize)document.getElementById('font-size-sel').value=settings.fontSize;
}

function switchMode(mode,btn){
  currentMode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('input').placeholder=MODES[mode].placeholder;
  document.getElementById('input-hint').textContent=MODES[mode].hint;
  if(!history.length)showWelcome();
}

// ══ SPEECH RECOGNITION (typing mode) ══
function initSpeechRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('mic-btn').style.opacity='.3';return;}
  recognition=new SR();
  recognition.continuous=false;recognition.interimResults=true;
  let final_='';
  recognition.onstart=()=>{isRecording=true;final_='';document.getElementById('mic-btn').classList.add('recording');document.getElementById('voice-status').classList.add('show');};
  recognition.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final_+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript;}
    const inp=document.getElementById('input');inp.value=final_+interim;inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,180)+'px';
    document.getElementById('send-btn').disabled=!inp.value.trim();
  };
  recognition.onend=()=>{isRecording=false;document.getElementById('mic-btn').classList.remove('recording');document.getElementById('voice-status').classList.remove('show');document.getElementById('input').placeholder=MODES[currentMode].placeholder;};
  recognition.onerror=e=>{isRecording=false;document.getElementById('mic-btn').classList.remove('recording');document.getElementById('voice-status').classList.remove('show');if(e.error==='not-allowed')showToast('请允许麦克风权限');};
}

function toggleMic(){
  if(!recognition){showToast('请使用Chrome浏览器以支持语音输入');return;}
  if(isRecording){recognition.stop();}
  else{recognition.lang=currentMode==='speak'?document.getElementById('call-lang-select').value:'zh-CN';recognition.start();}
}

// ══ CALL SYSTEM ══
function buildWaveform(){
  const wf=document.getElementById('waveform');wf.innerHTML='';
  for(let i=0;i<18;i++){const b=document.createElement('div');b.className='wave-bar';b.style.height='6px';wf.appendChild(b);}
}

function animateWave(active){
  const bars=document.querySelectorAll('.wave-bar');
  if(active){
    waveInterval=setInterval(()=>{bars.forEach(b=>{b.style.height=(4+Math.random()*28)+'px';b.classList.toggle('active',Math.random()>.3);});},120);
  }else{
    clearInterval(waveInterval);waveInterval=null;
    bars.forEach(b=>{b.style.height='6px';b.classList.remove('active');});
  }
}

function openCall(){document.getElementById('call-overlay').classList.add('show');}

function startCall(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('请使用Chrome浏览器以支持通话功能');return;}
  callActive=true;
  document.getElementById('pre-call-controls').style.display='none';
  document.getElementById('call-controls').style.display='flex';
  document.getElementById('call-status').textContent='通话中…';
  addCallTranscript('系统','通话已接通，请开始说话 👋','rgba(255,255,255,.35)');
  listenCall();
}

function listenCall(){
  if(!callActive)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  callRecognition=new SR();
  const lang=document.getElementById('call-lang-select').value;
  callRecognition.lang=lang;
  callRecognition.continuous=false;callRecognition.interimResults=false;

  document.getElementById('call-avatar').className='call-avatar-ring listening';
  document.getElementById('call-status').textContent='🎙️ 正在聆听…';
  animateWave(true);

  callRecognition.onresult=e=>{
    const text=e.results[0][0].transcript;
    animateWave(false);
    addCallTranscript('你',text,'#a78bfa');
    sendCallMessage(text,lang);
  };

  callRecognition.onerror=e=>{
    animateWave(false);
    if(e.error==='not-allowed'){showToast('请允许麦克风权限');endCall();return;}
    if(callActive&&e.error!=='aborted'){
      document.getElementById('call-status').textContent='未检测到声音，请重新说话…';
      setTimeout(()=>{if(callActive)listenCall();},1500);
    }
  };

  callRecognition.onend=()=>{
    animateWave(false);
    // If no result was handled (timeout/silence), restart listening
    if(callActive&&!callBusy){
      setTimeout(()=>{if(callActive&&!callBusy)listenCall();},500);
    }
  };

  if(!callMuted)callRecognition.start();
}

async function sendCallMessage(text,lang){
  if(callBusy)return;
  callBusy=true;
  document.getElementById('call-avatar').className='call-avatar-ring';
  document.getElementById('call-status').textContent='⏳ AI 思考中…';

  // Also add to main chat history
  const userMsg={role:'user',content:text};
  history.push(userMsg);
  if(document.getElementById('messages').querySelector('#welcome'))document.getElementById('messages').querySelector('#welcome')?.closest('.msg-wrap')?.remove();
  document.getElementById('messages').appendChild(buildMsgEl(userMsg,history.length-1));
  scrollBottom();
  saveConv(text);

  const callPrompt=`你是「语伴AI」外语口语练习助手。用户正在用${lang}进行语音通话练习。请：
1. 用${lang}对应的语言自然回复（如英语用英语回，日语用日语回）
2. 回复要简洁自然，像真实对话，不超过3句话
3. 在回复末尾加一句中文括号说明：（语言点：xxx）
4. 不要用Markdown格式，纯文本即可`;

  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:history.slice(-6).map(m=>({role:m.role,content:m.content})),systemPrompt:callPrompt})});
    const d=await r.json();
    const reply=(d.reply||'Sorry, I had trouble understanding. Could you repeat that?').replace(/<think>[\s\S]*?<\/think>/i,'').trim();

    const aiMsg={role:'assistant',content:reply};
    history.push(aiMsg);
    document.getElementById('messages').appendChild(buildMsgEl(aiMsg,history.length-1));
    scrollBottom();
    saveConv(text);

    addCallTranscript('语伴AI',reply,'#e8e4f8');
    document.getElementById('call-status').textContent='🔊 语伴AI 正在说话…';
    document.getElementById('call-avatar').className='call-avatar-ring speaking';
    animateWave(true);
    speakText(reply,lang,()=>{
      callBusy=false;
      animateWave(false);
      document.getElementById('call-avatar').className='call-avatar-ring';
      if(callActive)setTimeout(()=>listenCall(),600);
    });
  }catch{
    callBusy=false;
    document.getElementById('call-status').textContent='出错了，请重试…';
    animateWave(false);
    if(callActive)setTimeout(()=>listenCall(),2000);
  }
}

function speakText(text,lang,onEnd){
  if(!speakerOn){onEnd();return;}
  synth.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang=lang;
  utt.rate=0.95;utt.pitch=1.05;
  // Try to pick a good voice for the language
  const voices=synth.getVoices();
  const match=voices.find(v=>v.lang.startsWith(lang.split('-')[0])&&!v.name.includes('Google'));
  if(match)utt.voice=match;
  utt.onend=onEnd;utt.onerror=onEnd;
  synth.speak(utt);
}

function addCallTranscript(who,text,color){
  const div=document.getElementById('call-transcript');
  const old=div.querySelector('span[style]');if(old)old.remove();
  const p=document.createElement('p');p.style.marginBottom='6px';
  p.innerHTML=`<span style="color:${color};font-weight:600">${who}：</span><span style="color:rgba(255,255,255,.75)">${esc(text)}</span>`;
  div.appendChild(p);div.scrollTop=div.scrollHeight;
}

function endCall(){
  callActive=false;callBusy=false;
  if(callRecognition){try{callRecognition.stop();}catch(e){}}
  synth.cancel();animateWave(false);
  document.getElementById('call-overlay').classList.remove('show');
  document.getElementById('pre-call-controls').style.display='';
  document.getElementById('call-controls').style.display='none';
  document.getElementById('call-avatar').className='call-avatar-ring';
  document.getElementById('call-status').textContent='选择语言，点击接听开始通话';
  document.getElementById('call-transcript').innerHTML='<span style="color:rgba(255,255,255,.3);font-size:13px">通话内容将显示在这里…</span>';
  showToast('通话已结束');
}

function toggleCallMute(){
  callMuted=!callMuted;
  const btn=document.getElementById('btn-mute-call');
  btn.classList.toggle('muted',callMuted);
  btn.querySelector('.ctrl-btn-icon').textContent=callMuted?'🔇':'🎙️';
  btn.querySelector('.ctrl-btn-label').textContent=callMuted?'取消静音':'静音';
  if(callMuted&&callRecognition){try{callRecognition.stop();}catch(e){}}
  else if(!callMuted&&callActive&&!callBusy)listenCall();
}

function toggleSpeaker(){
  speakerOn=!speakerOn;
  const btn=document.getElementById('btn-speaker');
  btn.classList.toggle('off',!speakerOn);
  btn.querySelector('.ctrl-btn-icon').textContent=speakerOn?'🔊':'🔇';
  if(!speakerOn)synth.cancel();
}

// ══ SIDEBAR & CONVS ══
function renderSidebar(filter=''){
  const list=document.getElementById('conv-list');
  const f=filter.toLowerCase();
  const filtered=f?convs.filter(c=>c.title.toLowerCase().includes(f)):convs;
  if(!filtered.length){list.innerHTML=`<div style="padding:24px 10px;text-align:center;font-size:13px;color:rgba(255,255,255,.2)">${f?'没有找到':'暂无对话历史'}</div>`;return;}
  const today=new Date();today.setHours(0,0,0,0);
  const yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
  const groups={};
  filtered.forEach(c=>{const d=new Date(c.ts||Date.now());d.setHours(0,0,0,0);const g=d>=today?'今天':d>=yesterday?'昨天':'更早';if(!groups[g])groups[g]=[];groups[g].push(c);});
  let html='';
  ['今天','昨天','更早'].forEach(g=>{
    if(!groups[g])return;
    html+=`<div class="conv-group-label">${g}</div>`;
    groups[g].forEach(c=>{html+=`<div class="conv-item${c.id===activeId?' active':''}" onclick="loadConv('${c.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="ci-title">${esc(c.title)}</span><span class="ci-del" onclick="delConv(event,'${c.id}')">×</span></div>`;});
  });
  list.innerHTML=html;
}

function toggleSidebar(){const s=document.getElementById('sidebar');if(window.innerWidth<=640)s.classList.toggle('mobile-open');else s.classList.toggle('hidden');}
function newChat(){activeId=null;history=[];attachments=[];showWelcome();renderSidebar();document.getElementById('topbar-title').textContent='语伴 AI';document.getElementById('attach-preview-bar').innerHTML='';document.getElementById('attach-preview-bar').classList.remove('show');if(window.innerWidth<=640)document.getElementById('sidebar').classList.remove('mobile-open');}
function loadConv(id){const c=convs.find(x=>x.id===id);if(!c)return;activeId=id;history=[...(c.messages||[])];attachments=[];renderSidebar();renderMessages();document.getElementById('topbar-title').textContent=c.title;if(window.innerWidth<=640)document.getElementById('sidebar').classList.remove('mobile-open');}
function saveConv(firstText){
  if(!activeId){activeId=Date.now().toString();const e=MODES[currentMode].label.slice(0,2);const title=e+' '+firstText.slice(0,26)+(firstText.length>26?'…':'');convs.unshift({id:activeId,title,ts:Date.now(),messages:history});document.getElementById('topbar-title').textContent=firstText.slice(0,22)+(firstText.length>22?'…':'');}
  else{const c=convs.find(x=>x.id===activeId);if(c){c.messages=history;c.ts=Date.now();}}
  localStorage.setItem('yuban_convs',JSON.stringify(convs));renderSidebar();
}
function delConv(e,id){e.stopPropagation();convs=convs.filter(c=>c.id!==id);localStorage.setItem('yuban_convs',JSON.stringify(convs));if(activeId===id)newChat();else renderSidebar();}
function clearAll(){document.getElementById('clear-modal').classList.add('show');}
function confirmClearAll(){convs=[];localStorage.removeItem('yuban_convs');document.getElementById('clear-modal').classList.remove('show');newChat();}

// ══ PARSE & RENDER ══
function parseReply(raw){const m=raw.match(/<think>([\s\S]*?)<\/think>/i);return{think:m?m[1].trim():null,answer:raw.replace(/<think>[\s\S]*?<\/think>/i,'').trim()};}
function buildThinkBlock(text){const id='tk'+Date.now()+Math.random().toString(36).slice(2);return`<div class="think-block"><div class="think-header" onclick="toggleThink('${id}')"><span>💭 查看分析过程</span><span class="think-arrow" id="${id}-a">▼</span></div><div class="think-body" id="${id}">${text.split('\n').filter(l=>l.trim()).map(l=>`<p>${esc(l)}</p>`).join('')}</div></div>`;}
function toggleThink(id){document.getElementById(id)?.classList.toggle('open');document.getElementById(id+'-a')?.classList.toggle('open');}

function renderMessages(){const el=document.getElementById('messages');el.innerHTML='';history.forEach((m,i)=>el.appendChild(buildMsgEl(m,i)));scrollBottom();}
function buildMsgEl(m,idx){
  const wrap=document.createElement('div');wrap.className='msg-group';
  if(m.role==='user'){
    let atHtml='';if(m.attachments?.length){atHtml='<div class="attach-row">';m.attachments.forEach(a=>{atHtml+=`<div class="attach-chip"><span>${fileIcon(a.name)}</span><span style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500">${esc(a.name)}</span></div>`;});atHtml+='</div>';}
    wrap.innerHTML=`<div class="msg-user"><div><div style="display:flex;flex-direction:column;align-items:flex-end">${atHtml}<div class="user-bubble">${esc(m.content||'')}</div></div><div class="msg-actions" style="justify-content:flex-end"><button class="ma-btn" onclick="copyText(${JSON.stringify(m.content||'')})">📋 复制</button></div></div><div class="user-av">我</div></div>`;
  }else{
    const{think,answer}=parseReply(m.content||'');
    wrap.innerHTML=`<div class="msg-ai">${AI_AV}<div><div class="ai-content-wrap"><div class="ai-body">${think?buildThinkBlock(think):''}${fmt(answer)}</div></div><div class="msg-actions"><button class="ma-btn" onclick="copyText(${JSON.stringify(answer)})">📋 复制</button><button class="ma-btn" onclick="regenFrom(${idx})">🔄 重新生成</button></div></div></div>`;
  }
  return wrap;
}
function addMsgEl(m){document.getElementById('welcome')?.closest('.msg-wrap')?.remove();document.getElementById('messages').appendChild(buildMsgEl(m,history.length-1));scrollBottom();}
function quick(text){document.getElementById('input').value=text;onInput();send();}

// ══ SEND ══
async function send(){
  const inp=document.getElementById('input');const text=inp.value.trim();
  if((!text&&!attachments.length)||busy)return;
  inp.value='';inp.style.height='auto';
  const userMsg={role:'user',content:text,attachments:attachments.length?[...attachments]:undefined};
  history.push(userMsg);addMsgEl(userMsg);saveConv(text||'上传了文件');
  attachments=[];document.getElementById('attach-preview-bar').innerHTML='';document.getElementById('attach-preview-bar').classList.remove('show');
  busy=true;document.getElementById('send-btn').disabled=true;document.getElementById('send-btn').style.display='none';document.getElementById('stop-btn').style.display='flex';
  let content=text;if(userMsg.attachments?.length){const desc=userMsg.attachments.map(a=>a.textContent?`[文件: ${a.name}]\n内容：\n${a.textContent}`:`[文件: ${a.name}]`).join('\n\n');content=desc+(text?'\n\n用户问题：'+text:'');}
  const typingEl=document.createElement('div');typingEl.className='msg-group';typingEl.id='typing';
  typingEl.innerHTML=`<div class="msg-ai">${AI_AV}<div><div class="ai-content-wrap"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div></div>`;
  document.getElementById('messages').appendChild(typingEl);scrollBottom();
  const apiMsgs=history.slice(-8,-1).filter(m=>m.role).map(m=>({role:m.role,content:m.content}));apiMsgs.push({role:'user',content});
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:apiMsgs,systemPrompt:MODES[currentMode].prompt})});
    const d=await r.json();document.getElementById('typing')?.remove();
    const reply=d.reply||d.error||'出错了，请重试';
    const aiMsg={role:'assistant',content:reply};history.push(aiMsg);addMsgEl(aiMsg);saveConv(text);
  }catch{document.getElementById('typing')?.remove();const aiMsg={role:'assistant',content:'网络出错，请检查连接后重试。'};history.push(aiMsg);addMsgEl(aiMsg);}
  busy=false;document.getElementById('stop-btn').style.display='none';document.getElementById('send-btn').style.display='flex';document.getElementById('send-btn').disabled=!document.getElementById('input').value.trim();
}
function stopGen(){busy=false;document.getElementById('stop-btn').style.display='none';document.getElementById('send-btn').style.display='flex';document.getElementById('typing')?.remove();}
function regenFrom(idx){if(busy)return;let ui=idx;while(ui>=0&&history[ui].role!=='user')ui--;if(ui<0)return;const last=history[ui];history=history.slice(0,ui);renderMessages();document.getElementById('input').value=last.content||'';send();}

// ══ FILES ══
function handleFiles(files){Array.from(files).forEach(file=>{const reader=new FileReader();const size=file.size<1024?file.size+' B':file.size<1048576?(file.size/1024).toFixed(1)+' KB':(file.size/1048576).toFixed(1)+' MB';reader.onload=e=>{attachments.push({name:file.name,size,textContent:e.target.result});renderAttachBar();};reader.readAsText(file,'utf-8');});document.getElementById('file-input').value='';}
function renderAttachBar(){const bar=document.getElementById('attach-preview-bar');bar.classList.add('show');bar.innerHTML=attachments.map((a,i)=>`<div class="ap-chip"><span>${fileIcon(a.name)}</span><span class="ap-chip-name">${esc(a.name)}</span><button class="ap-chip-rm" onclick="removeAttach(${i})">×</button></div>`).join('');}
function removeAttach(i){attachments.splice(i,1);if(!attachments.length){document.getElementById('attach-preview-bar').classList.remove('show');document.getElementById('attach-preview-bar').innerHTML='';}else renderAttachBar();}
function fileIcon(n){return({csv:'📊',txt:'📃',md:'📃',json:'🔧'})[(n.split('.').pop()||'').toLowerCase()]||'📁';}

// ══ INPUT ══
function onInput(){const inp=document.getElementById('input');inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,180)+'px';document.getElementById('send-btn').disabled=(!inp.value.trim()&&!attachments.length)||busy;}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function scrollBottom(){const el=document.getElementById('messages');el.scrollTop=el.scrollHeight;}
function onScroll(){const el=document.getElementById('messages');document.getElementById('scroll-btn').classList.toggle('show',el.scrollHeight-el.scrollTop-el.clientHeight>120);}

function toggleDark(){document.body.classList.toggle('dark');settings.dark=document.body.classList.contains('dark');document.getElementById('dark-toggle').classList.toggle('on',settings.dark);localStorage.setItem('yuban_settings',JSON.stringify(settings));}
function exportChat(){if(!history.length){showToast('没有可导出的对话');return;}const text=history.map(m=>{const{answer}=parseReply(m.content||'');return`【${m.role==='user'?'我':'语伴AI'}】\n${m.role==='user'?m.content:answer}`;}).join('\n\n---\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=`语伴AI_${new Date().toLocaleDateString('zh')}.txt`;a.click();showToast('已导出对话记录');}

// ══ UTILS ══
function copyText(t){navigator.clipboard.writeText(t).then(()=>showToast('已复制 ✓'));}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(t){
  if(!t)return'';
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<div class="code-block-wrap"><div class="code-header"><span class="code-lang">${l||'code'}</span><button class="copy-code-btn" onclick="copyText(${JSON.stringify(c.trim())})">复制</button></div><pre><code>${esc(c.trim())}</code></pre></div>`);
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*\*(.*?)\*\*\*/g,'<strong><em>$1</em></strong>');
  t=t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\*(.*?)\*/g,'<em>$1</em>');
  t=t.replace(/^### (.*)/gm,'<h3>$1</h3>');t=t.replace(/^## (.*)/gm,'<h2>$1</h2>');t=t.replace(/^# (.*)/gm,'<h1>$1</h1>');
  t=t.replace(/^> (.*)/gm,'<blockquote>$1</blockquote>');
  t=t.replace(/(\|.+\|\n)(\|[-|: ]+\|\n)((?:\|.+\|\n)*)/g,m=>{const rows=m.trim().split('\n');const hdr=rows[0].split('|').filter(Boolean).map(c=>`<th>${c.trim()}</th>`).join('');const bdy=rows.slice(2).map(r=>'<tr>'+r.split('|').filter(Boolean).map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>').join('');return`<table><thead><tr>${hdr}</tr></thead><tbody>${bdy}</tbody></table>`;});
  t=t.replace(/^(\s*[-*] .+\n?)+/gm,m=>`<ul>${m.trim().split('\n').map(l=>`<li>${l.replace(/^\s*[-*] /,'')}</li>`).join('')}</ul>`);
  t=t.replace(/^(\s*\d+\. .+\n?)+/gm,m=>`<ol>${m.trim().split('\n').map(l=>`<li>${l.replace(/^\s*\d+\. /,'')}</li>`).join('')}</ol>`);
  return t.split(/\n{2,}/).map(p=>{p=p.trim();if(!p)return'';if(/^<(h[123]|ul|ol|table|pre|div|blockquote)/.test(p))return p;return`<p>${p.replace(/\n/g,'<br>')}</p>`;}).join('');
}
document.querySelectorAll('.modal-overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('show');}));
// Load voices when available
if(synth)synth.onvoiceschanged=()=>synth.getVoices();
init();
</script>
