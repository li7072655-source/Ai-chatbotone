<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>语伴 AI · 你的外语学习伙伴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fc;
  --panel:#ffffff;
  --sidebar:#1e1b2e;
  --sidebar-hover:#2d2845;
  --sidebar-active:#3d3660;
  --border:#e8eaf0;
  --border2:#d1d5e0;
  --text:#1a1d2e;
  --text2:#6b7080;
  --text3:#a0a6b8;
  --accent:#7c3aed;
  --accent-h:#6d28d9;
  --accent-light:#f0ebff;
  --accent-glow:rgba(124,58,237,.18);
  --user-bubble:#7c3aed;
  --ai-bg:#ffffff;
  --input-bg:#ffffff;
  --hover:#f0ebff;
  --danger:#ef4444;
  --think-bg:#fffbeb;
  --think-border:#fbbf24;
  --tag-bg:#ede9fe;--tag-text:#7c3aed;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1);
  --radius:14px;
  --sidebar-w:256px;
}
.dark{
  --bg:#0f0d1a;
  --panel:#1a1728;
  --sidebar:#0d0b16;
  --sidebar-hover:#1e1b2e;
  --sidebar-active:#2d2845;
  --border:#252236;
  --border2:#302d45;
  --text:#e8e4f8;
  --text2:#8b8aaa;
  --text3:#4a4870;
  --accent-light:#2d1f4a;
  --accent-glow:rgba(124,58,237,.25);
  --user-bubble:#6d28d9;
  --ai-bg:#1a1728;
  --input-bg:#1e1b2e;
  --hover:#2d2845;
  --think-bg:#1e1a0e;
  --think-border:#92400e;
  --tag-bg:#2d1f4a;--tag-text:#c4b5fd;
  --shadow:0 2px 12px rgba(0,0,0,.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;font-size:15px;transition:background .25s,color .25s}

/* ═══ SIDEBAR ═══ */
#sidebar{
  width:var(--sidebar-w);background:var(--sidebar);
  display:flex;flex-direction:column;flex-shrink:0;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  position:relative;z-index:10;
}
#sidebar.hidden{transform:translateX(-100%);width:0;overflow:hidden}
#sidebar-brand{
  padding:20px 16px 14px;
  display:flex;align-items:center;gap:11px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.brand-logo-wrap{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(124,58,237,.4);flex-shrink:0;
}
.brand-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px}
#sidebar-top{padding:12px 10px 6px;display:flex;flex-direction:column;gap:7px}
#new-btn{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-radius:10px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.8);font-size:13px;font-family:inherit;cursor:pointer;
  transition:.15s;width:100%;
}
#new-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.sb-search{
  display:flex;align-items:center;gap:7px;
  padding:8px 11px;border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);
}
.sb-search input{
  border:none;outline:none;background:transparent;
  font-size:13px;color:rgba(255,255,255,.7);flex:1;font-family:inherit;
}
.sb-search input::placeholder{color:rgba(255,255,255,.3)}
#conv-list{flex:1;overflow-y:auto;padding:4px 8px}
#conv-list::-webkit-scrollbar{width:3px}
#conv-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.conv-group-label{
  font-size:10px;color:rgba(255,255,255,.3);
  padding:12px 8px 5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
}
.conv-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:9px;cursor:pointer;
  transition:.12s;margin-bottom:2px;
}
.conv-item:hover{background:var(--sidebar-hover)}
.conv-item.active{background:var(--sidebar-active)}
.conv-item .ci-icon{color:rgba(255,255,255,.35);flex-shrink:0}
.conv-item .ci-title{flex:1;font-size:13px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item.active .ci-title{color:#fff}
.conv-item .ci-del{opacity:0;color:rgba(255,255,255,.3);font-size:16px;cursor:pointer;padding:1px 4px;border-radius:4px;flex-shrink:0;line-height:1}
.conv-item:hover .ci-del{opacity:1}
.conv-item .ci-del:hover{color:#ef4444}
#sidebar-footer{
  padding:10px 10px 14px;
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;gap:2px;
}
.sf-btn{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:9px;
  cursor:pointer;font-size:13px;
  color:rgba(255,255,255,.45);transition:.12s;user-select:none;
}
.sf-btn:hover{background:var(--sidebar-hover);color:rgba(255,255,255,.8)}
.sf-btn svg{flex-shrink:0}

/* ═══ MAIN ═══ */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* TOPBAR */
#topbar{
  display:flex;align-items:center;gap:10px;
  padding:12px 20px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 0 var(--border);
  flex-shrink:0;
}
#toggle-sidebar{
  background:none;border:none;cursor:pointer;
  color:var(--text2);padding:6px;border-radius:8px;
  display:flex;align-items:center;transition:.12s;
}
#toggle-sidebar:hover{background:var(--hover);color:var(--accent)}
#topbar-center{flex:1;display:flex;align-items:center;gap:8px;overflow:hidden}
#topbar-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang-badge{
  font-size:11px;font-weight:500;
  padding:3px 9px;border-radius:20px;
  background:var(--accent-light);color:var(--accent);
  white-space:nowrap;flex-shrink:0;
  border:1px solid rgba(124,58,237,.2);
}
.tb-btn{
  display:flex;align-items:center;gap:5px;
  background:none;border:1px solid var(--border2);
  border-radius:9px;cursor:pointer;
  color:var(--text2);padding:6px 12px;
  font-size:12px;font-family:inherit;
  transition:.15s;white-space:nowrap;
}
.tb-btn:hover{background:var(--hover);color:var(--accent);border-color:var(--accent)}

/* MODE BAR */
#mode-bar{
  display:flex;gap:5px;padding:10px 20px 8px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex-shrink:0;overflow-x:auto;
}
#mode-bar::-webkit-scrollbar{display:none}
.mode-btn{
  display:flex;align-items:center;gap:5px;
  padding:6px 14px;border-radius:20px;
  border:1px solid var(--border2);
  font-size:12px;font-weight:500;font-family:inherit;
  cursor:pointer;background:transparent;color:var(--text2);
  transition:.15s;white-space:nowrap;
}
.mode-btn:hover{background:var(--hover);color:var(--accent);border-color:var(--accent)}
.mode-btn.active{
  background:var(--accent);color:#fff;
  border-color:var(--accent);
  box-shadow:0 2px 8px var(--accent-glow);
}

/* MESSAGES */
#messages{flex:1;overflow-y:auto;padding:28px 0 12px;scroll-behavior:smooth;background:var(--bg)}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.msg-wrap{max-width:780px;margin:0 auto;padding:0 24px}

/* WELCOME */
#welcome{padding:20px 0 32px}
.welcome-hero{text-align:center;margin-bottom:32px;padding:40px 24px;background:var(--panel);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow)}
.welcome-logo-ring{
  width:72px;height:72px;border-radius:20px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:18px;
  box-shadow:0 8px 24px rgba(124,58,237,.35);
}
.welcome-hero h1{font-size:26px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
.welcome-hero h1 span{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.welcome-hero p{color:var(--text2);font-size:14px;line-height:1.65;margin-bottom:18px}
.lang-pills{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.lang-pill{
  font-size:12px;font-weight:500;
  padding:5px 12px;border-radius:20px;
  background:var(--accent-light);color:var(--accent);
  border:1px solid rgba(124,58,237,.15);
}
.sug-section-label{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
.sug-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.sug-card{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;cursor:pointer;transition:.18s;
  background:var(--panel);text-align:left;
  box-shadow:var(--shadow);
}
.sug-card:hover{border-color:var(--accent);background:var(--accent-light);transform:translateY(-1px);box-shadow:0 4px 16px var(--accent-glow)}
.sc-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sc-icon{font-size:17px;flex-shrink:0}
.sc-title{font-size:13px;font-weight:600;color:var(--text)}
.sc-sub{font-size:12px;color:var(--text2);line-height:1.45}

/* MSG ROWS */
.msg-group{margin-bottom:20px;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* USER bubble */
.msg-user{display:flex;justify-content:flex-end;gap:10px;align-items:flex-end;margin-bottom:4px}
.user-av{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.user-bubble{
  background:var(--user-bubble);
  background:linear-gradient(135deg,#7c3aed,#8b5cf6);
  color:#fff;
  padding:11px 16px;
  border-radius:18px 18px 4px 18px;
  font-size:15px;line-height:1.65;
  max-width:82%;word-break:break-word;white-space:pre-wrap;
  box-shadow:0 4px 14px rgba(124,58,237,.3);
}

/* AI bubble */
.msg-ai{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:flex-start;margin-bottom:4px}
.ai-av{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(124,58,237,.3);flex-shrink:0;
  margin-top:2px;
}
.ai-content-wrap{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px 18px 18px 4px;
  padding:14px 18px;
  box-shadow:var(--shadow);
  min-width:0;word-break:break-word;
}
.ai-body{font-size:15px;line-height:1.78;color:var(--text)}
.ai-body p{margin-bottom:10px}
.ai-body p:last-child{margin-bottom:0}
.ai-body strong{font-weight:600;color:var(--text)}
.ai-body em{font-style:italic;color:var(--accent)}
.ai-body ul,.ai-body ol{padding-left:22px;margin-bottom:10px}
.ai-body li{margin-bottom:5px;line-height:1.6}
.ai-body h3{font-size:15px;font-weight:600;color:var(--accent);margin:14px 0 6px}
.ai-body h2{font-size:17px;font-weight:600;margin:14px 0 6px}
.ai-body blockquote{border-left:3px solid var(--accent);padding:8px 14px;color:var(--text2);margin:10px 0;background:var(--accent-light);border-radius:0 10px 10px 0}
.ai-body table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;border-radius:8px;overflow:hidden}
.ai-body th,.ai-body td{border:1px solid var(--border);padding:9px 13px;text-align:left}
.ai-body th{background:var(--accent-light);font-weight:600;color:var(--accent);font-size:13px}
.ai-body code{background:var(--accent-light);color:var(--accent);border:1px solid rgba(124,58,237,.15);padding:1px 6px;border-radius:5px;font-size:13px;font-family:'SF Mono','Consolas',monospace}
.code-block-wrap{margin:12px 0;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.code-header{display:flex;align-items:center;justify-content:space-between;background:#1e1b2e;padding:8px 14px}
.code-lang{font-size:12px;color:#a78bfa;font-weight:600;font-family:monospace}
.copy-code-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#a0a6b8;cursor:pointer;font-size:11px;padding:3px 9px;border-radius:6px;font-family:inherit;transition:.12s}
.copy-code-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.ai-body pre{background:#0f0d1a;color:#e2e0f0;padding:16px;font-size:13px;font-family:'SF Mono','Consolas',monospace;overflow-x:auto;line-height:1.65;margin:0}
.ai-body pre code{background:none;border:none;padding:0;color:inherit;font-size:inherit}

/* ATTACH in user bubble */
.attach-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;justify-content:flex-end}
.attach-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:6px 11px;font-size:12px;color:#fff}
.attach-chip-icon{font-size:16px}
.attach-name{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.attach-size{opacity:.65;font-size:11px}

/* MSG ACTIONS */
.msg-actions{display:flex;gap:3px;margin-top:8px;opacity:0;transition:.15s}
.msg-group:hover .msg-actions{opacity:1}
.ma-btn{
  background:none;border:none;cursor:pointer;
  color:var(--text3);padding:4px 8px;border-radius:7px;
  font-size:11px;font-weight:500;
  display:flex;align-items:center;gap:3px;
  font-family:inherit;transition:.12s;
}
.ma-btn:hover{background:var(--hover);color:var(--accent)}

/* THINK BLOCK */
.think-block{
  border:1px solid var(--think-border);
  border-radius:10px;margin-bottom:14px;overflow:hidden;
  background:var(--think-bg);
}
.think-header{
  display:flex;align-items:center;gap:8px;
  padding:8px 13px;cursor:pointer;user-select:none;
  font-size:12px;font-weight:600;color:#92400e;
  transition:.12s;
}
.dark .think-header{color:#fbbf24}
.think-header:hover{opacity:.8}
.think-spin{animation:tspin 1.8s linear infinite;display:inline-block}
.think-spin.done{animation:none}
@keyframes tspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.think-arrow{margin-left:auto;font-size:10px;transition:transform .2s;opacity:.5}
.think-arrow.open{transform:rotate(180deg)}
.think-body{padding:0 13px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s}
.think-body.open{max-height:400px;padding:6px 13px 12px}
.think-body p{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:4px}

/* TYPING */
.typing-indicator{display:flex;gap:5px;padding:8px 2px;align-items:center}
.typing-indicator span{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);opacity:.5;
  animation:tblink 1.3s infinite;display:inline-block;
}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes tblink{0%,60%,100%{opacity:.25;transform:scale(.75)}30%{opacity:.9;transform:scale(1)}}

/* ═══ INPUT AREA ═══ */
#input-area{
  padding:12px 20px 16px;flex-shrink:0;
  background:var(--bg);
  border-top:1px solid var(--border);
}
#input-box{
  max-width:780px;margin:0 auto;
  background:var(--panel);
  border:1.5px solid var(--border2);
  border-radius:18px;
  box-shadow:var(--shadow);
  transition:border-color .2s,box-shadow .2s;
  overflow:hidden;
}
#input-box:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-glow),var(--shadow);
}
#attach-preview-bar{display:none;flex-wrap:wrap;gap:7px;padding:10px 14px 0}
#attach-preview-bar.show{display:flex}
.ap-chip{
  display:flex;align-items:center;gap:6px;position:relative;
  background:var(--accent-light);border:1px solid rgba(124,58,237,.2);
  border-radius:8px;padding:5px 10px;font-size:12px;color:var(--accent);
}
.ap-chip-icon{font-size:15px}
.ap-chip-name{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ap-chip-rm{
  background:none;border:none;cursor:pointer;
  color:var(--accent);font-size:14px;line-height:1;padding:0 2px;
  margin-left:2px;opacity:.6;transition:.12s;
}
.ap-chip-rm:hover{opacity:1}
#input-row{display:flex;align-items:flex-end;gap:8px;padding:10px 12px}
#input{
  flex:1;border:none;outline:none;background:transparent;
  font-size:15px;font-family:inherit;color:var(--text);
  resize:none;min-height:26px;max-height:180px;
  line-height:1.6;padding:0;
}
#input::placeholder{color:var(--text3)}
.ib-btn{
  background:none;border:none;cursor:pointer;
  color:var(--text3);padding:6px;border-radius:9px;
  display:flex;align-items:center;transition:.15s;flex-shrink:0;
}
.ib-btn:hover{background:var(--accent-light);color:var(--accent)}
#file-input{display:none}

/* MIC BUTTON */
#mic-btn{
  background:none;border:none;cursor:pointer;
  color:var(--text3);padding:6px;border-radius:9px;
  display:flex;align-items:center;transition:.15s;flex-shrink:0;
  position:relative;
}
#mic-btn:hover{background:var(--accent-light);color:var(--accent)}
#mic-btn.recording{
  color:#fff;background:var(--danger);
  animation:mic-pulse .9s infinite;
  box-shadow:0 0 0 0 rgba(239,68,68,.4);
}
@keyframes mic-pulse{
  0%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}
  70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}
  100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}
}
.mic-ripple{
  position:absolute;inset:-4px;border-radius:13px;
  border:2px solid var(--danger);opacity:0;
  animation:ripple 1s infinite;
}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}

#send-btn{
  width:38px;height:38px;border-radius:11px;border:none;
  background:linear-gradient(135deg,#7c3aed,#8b5cf6);
  color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:.15s;
  box-shadow:0 4px 12px rgba(124,58,237,.35);
}
#send-btn:hover{background:linear-gradient(135deg,#6d28d9,#7c3aed);transform:scale(1.04)}
#send-btn:disabled{background:var(--border2);box-shadow:none;transform:none;cursor:default}
#stop-btn{
  width:38px;height:38px;border-radius:11px;
  border:1.5px solid var(--border2);background:none;
  color:var(--text2);cursor:pointer;display:none;
  align-items:center;justify-content:center;flex-shrink:0;transition:.15s;
}
#stop-btn:hover{background:var(--hover);color:var(--danger);border-color:var(--danger)}
#input-footer{
  max-width:780px;margin:6px auto 0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4px;
}
#input-hint{font-size:11px;color:var(--text3)}
#voice-status{font-size:11px;color:var(--danger);font-weight:500;display:none}
#voice-status.show{display:block}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:24px;width:440px;max-width:90vw;box-shadow:var(--shadow-lg)}
.modal h2{font-size:17px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--hover);color:var(--text)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:14px;font-weight:500}
.setting-sub{font-size:12px;color:var(--text2);margin-top:2px}
.toggle{width:44px;height:25px;border-radius:13px;background:var(--border2);cursor:pointer;position:relative;transition:.2s;flex-shrink:0;border:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:19px;height:19px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.on::after{left:22px}
select.sel{background:var(--input-bg);border:1px solid var(--border2);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--text);font-family:inherit;outline:none;cursor:pointer}
.modal-footer{margin-top:18px;display:flex;justify-content:flex-end;gap:8px}
.btn{padding:9px 18px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;border:1px solid var(--border2);background:var(--hover);color:var(--text);font-weight:500;transition:.12s}
.btn:hover{background:var(--border2)}
.btn.primary{background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.btn.primary:hover{background:linear-gradient(135deg,#6d28d9,#7c3aed)}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}

/* SCROLL BTN */
#scroll-btn{
  position:fixed;bottom:110px;right:28px;
  background:var(--panel);border:1px solid var(--border2);
  border-radius:50%;width:38px;height:38px;
  display:none;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--shadow-lg);
  color:var(--accent);z-index:10;font-size:18px;
  transition:.15s;
}
#scroll-btn.show{display:flex}
#scroll-btn:hover{background:var(--accent-light);transform:scale(1.05)}

/* TOAST */
#toast{
  position:fixed;bottom:85px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--text);color:var(--panel);
  padding:9px 18px;border-radius:22px;
  font-size:13px;font-weight:500;opacity:0;
  transition:.25s;z-index:200;pointer-events:none;white-space:nowrap;
  box-shadow:var(--shadow-lg);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:50;transform:translateX(-100%)}
  #sidebar.mobile-open{transform:translateX(0)}
  .sug-grid{grid-template-columns:1fr}
  .msg-wrap{padding:0 14px}
  #input-area{padding:8px 14px 12px}
  #mode-bar{padding:8px 14px 6px}
}
</style>
</head>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-4l-4 4v-4z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

<script>
// ── STATE ──
let convs=JSON.parse(localStorage.getItem('yuban_convs')||'[]');
let activeId=null,history=[],attachments=[],busy=false;
let settings=JSON.parse(localStorage.getItem('yuban_settings')||'{}');
let currentMode='general';
let recognition=null,isRecording=false;

// ── AI AVATAR HTML ──
const AI_AV=`<div class="ai-av"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-4l-4 4v-4z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;

// ── MODES ──
const MODES={
  general:{label:'💬 自由对话',hint:'💬 自由对话 · Enter 发送 · 🎙️ 点麦克风语音输入',placeholder:'用任何语言提问，或直接用外语和我对话…',
    prompt:`你是「语伴 AI」，一个专门服务外语学习者的智能语言学习伙伴，支持英语、日语、韩语、法语、西班牙语等多种外语。请用清晰友好的中文回答（除非用户要求其他语言）。回答时先用<think>标签写2-3句分析思路，再给出结构清晰、举例丰富的正式回答。`},
  correct:{label:'✍️ 语法纠错',hint:'✍️ 语法纠错 · 粘贴或说出你写的外语句子',placeholder:'输入或说出你写的英语/日语/韩语句子，我来帮你纠错…',
    prompt:`你是「语伴 AI」语法纠错专家。先用<think>分析错误类型，然后输出：## 🔍 纠错报告\n**原文：** xxx\n**修正后：** xxx\n### 错误详情\n| 序号 | 错误 | 正确 | 说明 |\n|---|---|---|---|\n### 💡 学习建议\n[1-2条建议]`},
  translate:{label:'🔄 翻译解析',hint:'🔄 翻译解析 · 输入或说出想翻译的内容',placeholder:'输入或说出想翻译的句子或段落（支持任意语言）…',
    prompt:`你是「语伴 AI」翻译解析专家。先用<think>分析语言类型和翻译难点，然后输出：## 🔄 翻译结果\n**原文：** xxx\n**译文：** xxx\n### 📐 句子结构\n[分析]\n### 💎 关键词汇\n| 词汇 | 词性 | 含义 | 用法 |\n### 🌟 表达技巧\n[解释]`},
  speak:{label:'🗣️ 口语练习',hint:'🗣️ 口语练习 · 建议用麦克风说话来练习！',placeholder:'告诉我你想练习的语言和场景，例如：练习英语购物对话…',
    prompt:`你是「语伴 AI」口语练习教练。先用<think>设计场景和教学策略，然后扮演对话角色用目标语言与用户交流。每次用户回复后：继续对话保持场景沉浸感，在末尾用【语言点】标注可改进的表达，给出更地道的说法。语气友好鼓励。`},
  vocab:{label:'📖 词汇讲解',hint:'📖 词汇讲解 · 输入或说出不懂的单词/词组',placeholder:'输入或说出想学的单词、词组或短语（任何语言）…',
    prompt:`你是「语伴 AI」词汇讲解专家。先用<think>分析学习重点，然后输出：## 📖 [词汇]\n**基本释义：** xxx\n### 🎯 核心用法\n[3-5个例句，中外对照]\n### ⚠️ 易混淆词\n[近义词区别]\n### 🌍 文化/语境提示\n### 📝 记忆技巧`},
  culture:{label:'🌏 文化背景',hint:'🌏 文化背景 · 探索语言背后的文化世界',placeholder:'问任何关于语言文化的问题，例如：日语敬语的使用场合…',
    prompt:`你是「语伴 AI」跨文化交际专家。先用<think>分析文化核心，然后结合具体例子解答，对比中文母语者可能产生的文化误解，给出实用的跨文化交际建议，语气亲切生动。`}
};

// ── INIT ──
function init(){
  applySettings();
  initSpeechRecognition();
  if(convs.length>0)loadConv(convs[0].id);
  else showWelcome();
  renderSidebar();
  document.getElementById('input').placeholder=MODES[currentMode].placeholder;
}

function applySettings(){
  if(settings.dark)document.body.classList.add('dark');
  if(settings.fontSize)document.body.style.fontSize=settings.fontSize+'px';
  document.getElementById('dark-toggle').classList.toggle('on',!!settings.dark);
  if(settings.fontSize)document.getElementById('font-size-sel').value=settings.fontSize;
}

// ── SPEECH RECOGNITION ──
function initSpeechRecognition(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    document.getElementById('mic-btn').title='你的浏览器不支持语音输入（推荐使用Chrome）';
    document.getElementById('mic-btn').style.opacity='.35';
    return;
  }
  recognition=new SpeechRecognition();
  recognition.continuous=false;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;
  // 根据当前模式设置语言
  recognition.lang=getMicLang();

  let finalTranscript='';

  recognition.onstart=()=>{
    isRecording=true;
    finalTranscript='';
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('mic-ripple').style.display='block';
    document.getElementById('voice-status').classList.add('show');
    document.getElementById('input').placeholder='🎙️ 正在聆听，请说话…';
  };

  recognition.onresult=(e)=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)finalTranscript+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    const inp=document.getElementById('input');
    inp.value=finalTranscript+interim;
    inp.style.height='auto';
    inp.style.height=Math.min(inp.scrollHeight,180)+'px';
    document.getElementById('send-btn').disabled=!inp.value.trim();
  };

  recognition.onend=()=>{
    isRecording=false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-ripple').style.display='none';
    document.getElementById('voice-status').classList.remove('show');
    document.getElementById('input').placeholder=MODES[currentMode].placeholder;
    // 如果有内容，自动聚焦输入框
    const val=document.getElementById('input').value.trim();
    if(val)document.getElementById('input').focus();
  };

  recognition.onerror=(e)=>{
    isRecording=false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-ripple').style.display='none';
    document.getElementById('voice-status').classList.remove('show');
    document.getElementById('input').placeholder=MODES[currentMode].placeholder;
    if(e.error==='not-allowed')showToast('请允许麦克风权限后重试');
    else if(e.error!=='aborted')showToast('语音识别出错，请重试');
  };
}

function getMicLang(){
  // 口语练习模式：默认英文；其他模式：中文（让用户说中文描述问题）
  return currentMode==='speak'?'en-US':'zh-CN';
}

function toggleMic(){
  if(!recognition){showToast('浏览器不支持语音输入，请使用Chrome');return;}
  if(isRecording){recognition.stop();}
  else{
    recognition.lang=getMicLang();
    recognition.start();
  }
}

function switchMode(mode,btn){
  currentMode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const cfg=MODES[mode];
  document.getElementById('input').placeholder=cfg.placeholder;
  document.getElementById('input-hint').textContent=cfg.hint;
  if(!history.length)showWelcome();
}

// ── SIDEBAR ──
function renderSidebar(filter=''){
  const list=document.getElementById('conv-list');
  const f=filter.toLowerCase();
  const filtered=f?convs.filter(c=>c.title.toLowerCase().includes(f)):convs;
  if(!filtered.length){
    list.innerHTML=`<div style="padding:24px 10px;text-align:center;font-size:13px;color:rgba(255,255,255,.25)">${f?'没有找到相关对话':'暂无对话历史'}</div>`;return;
  }
  const today=new Date();today.setHours(0,0,0,0);
  const yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
  const groups={};
  filtered.forEach(c=>{
    const d=new Date(c.ts||Date.now());d.setHours(0,0,0,0);
    const g=d>=today?'今天':d>=yesterday?'昨天':'更早';
    if(!groups[g])groups[g]=[];groups[g].push(c);
  });
  let html='';
  ['今天','昨天','更早'].forEach(g=>{
    if(!groups[g])return;
    html+=`<div class="conv-group-label">${g}</div>`;
    groups[g].forEach(c=>{
      html+=`<div class="conv-item${c.id===activeId?' active':''}" onclick="loadConv('${c.id}')">
        <svg class="ci-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="ci-title">${esc(c.title)}</span>
        <span class="ci-del" onclick="delConv(event,'${c.id}')">×</span>
      </div>`;
    });
  });
  list.innerHTML=html;
}

function toggleSidebar(){
  const s=document.getElementById('sidebar');
  if(window.innerWidth<=640)s.classList.toggle('mobile-open');
  else s.classList.toggle('hidden');
}

// ── CONVS ──
function newChat(){
  activeId=null;history=[];attachments=[];
  showWelcome();renderSidebar();
  document.getElementById('topbar-title').textContent='语伴 AI';
  document.getElementById('attach-preview-bar').innerHTML='';
  document.getElementById('attach-preview-bar').classList.remove('show');
  if(window.innerWidth<=640)document.getElementById('sidebar').classList.remove('mobile-open');
}
function loadConv(id){
  const c=convs.find(x=>x.id===id);if(!c)return;
  activeId=id;history=[...(c.messages||[])];attachments=[];
  renderSidebar();renderMessages();
  document.getElementById('topbar-title').textContent=c.title;
  if(window.innerWidth<=640)document.getElementById('sidebar').classList.remove('mobile-open');
}
function saveConv(firstText){
  if(!activeId){
    activeId=Date.now().toString();
    const modeEmoji=MODES[currentMode].label.slice(0,2);
    const title=modeEmoji+' '+firstText.slice(0,26)+(firstText.length>26?'…':'');
    convs.unshift({id:activeId,title,ts:Date.now(),messages:history});
    document.getElementById('topbar-title').textContent=firstText.slice(0,22)+(firstText.length>22?'…':'');
  }else{
    const c=convs.find(x=>x.id===activeId);
    if(c){c.messages=history;c.ts=Date.now();}
  }
  localStorage.setItem('yuban_convs',JSON.stringify(convs));
  renderSidebar();
}
function delConv(e,id){
  e.stopPropagation();
  convs=convs.filter(c=>c.id!==id);
  localStorage.setItem('yuban_convs',JSON.stringify(convs));
  if(activeId===id)newChat();else renderSidebar();
}
function clearAll(){document.getElementById('clear-modal').classList.add('show');}
function confirmClearAll(){
  convs=[];localStorage.removeItem('yuban_convs');
  document.getElementById('clear-modal').classList.remove('show');
  newChat();
}

// ── PARSE THINK ──
function parseReply(raw){
  const m=raw.match(/<think>([\s\S]*?)<\/think>/i);
  return{think:m?m[1].trim():null,answer:raw.replace(/<think>[\s\S]*?<\/think>/i,'').trim()};
}
function buildThinkBlock(text){
  const id='tk'+Date.now()+Math.random().toString(36).slice(2);
  return`<div class="think-block"><div class="think-header" onclick="toggleThink('${id}')"><span class="think-spin done">💭</span><span>查看分析过程</span><span class="think-arrow" id="${id}-a">▼</span></div><div class="think-body" id="${id}">${text.split('\n').filter(l=>l.trim()).map(l=>`<p>${esc(l)}</p>`).join('')}</div></div>`;
}
function toggleThink(id){document.getElementById(id)?.classList.toggle('open');document.getElementById(id+'-a')?.classList.toggle('open');}

// ── RENDER ──
function renderMessages(){
  const el=document.getElementById('messages');el.innerHTML='';
  history.forEach((m,i)=>el.appendChild(buildMsgEl(m,i)));
  scrollBottom();
}
function buildMsgEl(m,idx){
  const wrap=document.createElement('div');wrap.className='msg-group';
  if(m.role==='user'){
    let atHtml='';
    if(m.attachments?.length){
      atHtml='<div class="attach-row">';
      m.attachments.forEach(a=>{atHtml+=`<div class="attach-chip"><span class="attach-chip-icon">${fileIcon(a.name)}</span><span class="attach-name">${esc(a.name)}</span><span class="attach-size">${a.size}</span></div>`;});
      atHtml+='</div>';
    }
    wrap.innerHTML=`<div class="msg-user"><div><div style="display:flex;flex-direction:column;align-items:flex-end">${atHtml}<div class="user-bubble">${esc(m.content||'')}</div></div><div class="msg-actions" style="justify-content:flex-end"><button class="ma-btn" onclick="copyText(${JSON.stringify(m.content||'')})">📋 复制</button></div></div><div class="user-av">我</div></div>`;
  }else{
    const{think,answer}=parseReply(m.content||'');
    wrap.innerHTML=`<div class="msg-ai">${AI_AV}<div><div class="ai-content-wrap"><div class="ai-body">${think?buildThinkBlock(think):''}${fmt(answer)}</div></div><div class="msg-actions"><button class="ma-btn" onclick="copyText(${JSON.stringify(answer)})">📋 复制</button><button class="ma-btn" onclick="regenFrom(${idx})">🔄 重新生成</button></div></div></div>`;
  }
  return wrap;
}
function addMsgEl(m){
  document.getElementById('welcome')?.closest('.msg-wrap')?.remove();
  document.getElementById('messages').appendChild(buildMsgEl(m,history.length-1));
  scrollBottom();
}
function quick(text){document.getElementById('input').value=text;onInput();send();}

// ── SEND ──
async function send(){
  const inp=document.getElementById('input');
  const text=inp.value.trim();
  if((!text&&!attachments.length)||busy)return;
  inp.value='';inp.style.height='auto';
  const userMsg={role:'user',content:text,attachments:attachments.length?[...attachments]:undefined};
  history.push(userMsg);addMsgEl(userMsg);
  saveConv(text||'上传了文件');
  attachments=[];
  document.getElementById('attach-preview-bar').innerHTML='';
  document.getElementById('attach-preview-bar').classList.remove('show');
  busy=true;
  document.getElementById('send-btn').disabled=true;
  document.getElementById('send-btn').style.display='none';
  document.getElementById('stop-btn').style.display='flex';
  let content=text;
  if(userMsg.attachments?.length){
    const desc=userMsg.attachments.map(a=>a.textContent?`[文件: ${a.name}]\n内容：\n${a.textContent}`:`[文件: ${a.name}]`).join('\n\n');
    content=desc+(text?'\n\n用户问题：'+text:'');
  }
  const typingEl=document.createElement('div');typingEl.className='msg-group';typingEl.id='typing';
  typingEl.innerHTML=`<div class="msg-ai">${AI_AV}<div><div class="ai-content-wrap"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div></div>`;
  document.getElementById('messages').appendChild(typingEl);scrollBottom();
  const apiMsgs=history.slice(-8,-1).filter(m=>m.role).map(m=>({role:m.role,content:m.content}));
  apiMsgs.push({role:'user',content});
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:apiMsgs,systemPrompt:MODES[currentMode].prompt})});
    const d=await r.json();
    document.getElementById('typing')?.remove();
    const reply=d.reply||d.error||'出错了，请重试';
    const aiMsg={role:'assistant',content:reply};
    history.push(aiMsg);addMsgEl(aiMsg);saveConv(text);
  }catch{
    document.getElementById('typing')?.remove();
    history.push({role:'assistant',content:'网络出错，请检查连接后重试。'});
    addMsgEl(history[history.length-1]);
  }
  busy=false;
  document.getElementById('stop-btn').style.display='none';
  document.getElementById('send-btn').style.display='flex';
  document.getElementById('send-btn').disabled=!document.getElementById('input').value.trim();
}
function stopGen(){busy=false;document.getElementById('stop-btn').style.display='none';document.getElementById('send-btn').style.display='flex';document.getElementById('typing')?.remove();}
function regenFrom(idx){
  if(busy)return;
  let ui=idx;while(ui>=0&&history[ui].role!=='user')ui--;
  if(ui<0)return;
  const last=history[ui];history=history.slice(0,ui);renderMessages();
  document.getElementById('input').value=last.content||'';send();
}

// ── FILES ──
function handleFiles(files){
  Array.from(files).forEach(file=>{
    const reader=new FileReader();
    const size=file.size<1024?file.size+' B':file.size<1048576?(file.size/1024).toFixed(1)+' KB':(file.size/1048576).toFixed(1)+' MB';
    reader.onload=e=>{attachments.push({name:file.name,size,textContent:e.target.result});renderAttachBar();};
    reader.readAsText(file,'utf-8');
  });
  document.getElementById('file-input').value='';
}
function renderAttachBar(){
  const bar=document.getElementById('attach-preview-bar');bar.classList.add('show');
  bar.innerHTML=attachments.map((a,i)=>`<div class="ap-chip"><span class="ap-chip-icon">${fileIcon(a.name)}</span><span class="ap-chip-name">${esc(a.name)}</span><button class="ap-chip-rm" onclick="removeAttach(${i})">×</button></div>`).join('');
}
function removeAttach(i){attachments.splice(i,1);if(!attachments.length){document.getElementById('attach-preview-bar').classList.remove('show');document.getElementById('attach-preview-bar').innerHTML='';}else renderAttachBar();}
function fileIcon(n){return({csv:'📊',txt:'📃',md:'📃',json:'🔧'})[(n.split('.').pop()||'').toLowerCase()]||'📁';}

// ── INPUT ──
function onInput(){
  const inp=document.getElementById('input');
  inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,180)+'px';
  document.getElementById('send-btn').disabled=(!inp.value.trim()&&!attachments.length)||busy;
}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}

// ── SCROLL ──
function scrollBottom(){const el=document.getElementById('messages');el.scrollTop=el.scrollHeight;}
function onScroll(){const el=document.getElementById('messages');document.getElementById('scroll-btn').classList.toggle('show',el.scrollHeight-el.scrollTop-el.clientHeight>120);}

// ── SETTINGS ──
function openSettings(){document.getElementById('settings-modal').classList.add('show');}
function closeSettings(){document.getElementById('settings-modal').classList.remove('show');}
function saveSettings(){settings.fontSize=document.getElementById('font-size-sel').value;settings.dark=document.body.classList.contains('dark');localStorage.setItem('yuban_settings',JSON.stringify(settings));document.body.style.fontSize=settings.fontSize+'px';closeSettings();showToast('设置已保存 ✓');}
function toggleDark(){document.body.classList.toggle('dark');settings.dark=document.body.classList.contains('dark');document.getElementById('dark-toggle').classList.toggle('on',settings.dark);localStorage.setItem('yuban_settings',JSON.stringify(settings));}

// ── EXPORT ──
function exportChat(){
  if(!history.length){showToast('没有可导出的对话');return;}
  const text=history.map(m=>{const{answer}=parseReply(m.content||'');return`【${m.role==='user'?'我':'语伴AI'}】\n${m.role==='user'?m.content:answer}`;}).join('\n\n---\n\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=`语伴AI_${new Date().toLocaleDateString('zh')}.txt`;a.click();showToast('已导出对话记录');
}

// ── UTILS ──
function copyText(t){navigator.clipboard.writeText(t).then(()=>showToast('已复制 ✓'));}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function fmt(t){
  if(!t)return'';
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<div class="code-block-wrap"><div class="code-header"><span class="code-lang">${l||'code'}</span><button class="copy-code-btn" onclick="copyText(${JSON.stringify(c.trim())})">复制</button></div><pre><code>${esc(c.trim())}</code></pre></div>`);
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*\*(.*?)\*\*\*/g,'<strong><em>$1</em></strong>');
  t=t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\*(.*?)\*/g,'<em>$1</em>');
  t=t.replace(/^### (.*)/gm,'<h3>$1</h3>');
  t=t.replace(/^## (.*)/gm,'<h2>$1</h2>');
  t=t.replace(/^# (.*)/gm,'<h1>$1</h1>');
  t=t.replace(/^> (.*)/gm,'<blockquote>$1</blockquote>');
  t=t.replace(/(\|.+\|\n)(\|[-|: ]+\|\n)((?:\|.+\|\n)*)/g,m=>{
    const rows=m.trim().split('\n');
    const hdr=rows[0].split('|').filter(Boolean).map(c=>`<th>${c.trim()}</th>`).join('');
    const bdy=rows.slice(2).map(r=>'<tr>'+r.split('|').filter(Boolean).map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>').join('');
    return`<table><thead><tr>${hdr}</tr></thead><tbody>${bdy}</tbody></table>`;
  });
  t=t.replace(/^(\s*[-*] .+\n?)+/gm,m=>`<ul>${m.trim().split('\n').map(l=>`<li>${l.replace(/^\s*[-*] /,'')}</li>`).join('')}</ul>`);
  t=t.replace(/^(\s*\d+\. .+\n?)+/gm,m=>`<ol>${m.trim().split('\n').map(l=>`<li>${l.replace(/^\s*\d+\. /,'')}</li>`).join('')}</ol>`);
  return t.split(/\n{2,}/).map(p=>{p=p.trim();if(!p)return'';if(/^<(h[123]|ul|ol|table|pre|div|blockquote)/.test(p))return p;return`<p>${p.replace(/\n/g,'<br>')}</p>`;}).join('');
}

document.querySelectorAll('.modal-overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('show');}));
init();
</script>
