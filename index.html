<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9f7f4;
      --sidebar-bg: #f0ede8;
      --border: #e5e0d8;
      --text-primary: #1a1814;
      --text-secondary: #6b6560;
      --text-tertiary: #a09890;
      --accent: #c96442;
      --accent-light: #f5ede9;
      --user-bg: #1a1814;
      --user-text: #f9f7f4;
      --ai-bg: transparent;
      --input-bg: #fff;
      --hover: #e8e3dc;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
      font-size: 15px;
    }
 
    /* Sidebar */
    #sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 20px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      flex-shrink: 0;
    }
    #sidebar-header span {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    #new-chat-btn {
      margin: 12px 10px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text-secondary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    #new-chat-btn:hover { background: var(--hover); color: var(--text-primary); }
    #new-chat-btn svg { flex-shrink: 0; }
    #conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .conv-item {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .conv-item:hover { background: var(--hover); color: var(--text-primary); }
    .conv-item.active { background: var(--hover); color: var(--text-primary); font-weight: 500; }
    #sidebar-footer {
      padding: 12px 10px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
      flex-shrink: 0;
    }
 
    /* Main */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
 
    /* Header */
    #header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
    }
    #model-badge {
      font-size: 12px;
      color: var(--text-tertiary);
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #5a9e6f; }
 
    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
 
    .msg-row {
      max-width: 740px;
      margin: 0 auto;
      padding: 0 24px;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row + .msg-row { margin-top: 24px; }
 
    /* AI message */
    .msg-row.ai { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; }
    .ai-avatar {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .ai-content {
      font-size: 15px;
      line-height: 1.75;
      color: var(--text-primary);
      padding-top: 4px;
    }
    .ai-content p { margin-bottom: 12px; }
    .ai-content p:last-child { margin-bottom: 0; }
    .ai-content strong { font-weight: 500; }
    .ai-content code {
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'SF Mono', 'Consolas', monospace;
    }
    .ai-content pre {
      background: var(--text-primary);
      color: #e8e3dc;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-family: 'SF Mono', 'Consolas', monospace;
      overflow-x: auto;
      margin: 10px 0;
      line-height: 1.6;
    }
    .ai-content pre code { background: none; border: none; padding: 0; color: inherit; font-size: inherit; }
    .ai-content ul, .ai-content ol { padding-left: 20px; margin-bottom: 12px; }
    .ai-content li { margin-bottom: 4px; }
 
    /* User message */
    .msg-row.user { display: flex; justify-content: flex-end; }
    .user-bubble {
      background: var(--user-bg);
      color: var(--user-text);
      padding: 10px 16px;
      border-radius: 18px;
      border-bottom-right-radius: 4px;
      font-size: 15px;
      line-height: 1.65;
      max-width: 85%;
      white-space: pre-wrap;
      word-break: break-word;
    }
 
    /* Typing */
    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 8px 0;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-tertiary);
      animation: blink 1.3s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,60%,100%{opacity:.25;transform:scale(.8)} 30%{opacity:1;transform:scale(1)} }
 
    /* Welcome */
    #welcome {
      max-width: 740px;
      margin: 40px auto;
      padding: 0 24px;
    }
    #welcome h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    #welcome p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sug-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--input-bg);
    }
    .sug-card:hover { border-color: var(--accent); background: var(--accent-light); }
    .sug-card .sug-title { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 3px; }
    .sug-card .sug-sub { font-size: 12px; color: var(--text-secondary); }
 
    /* Input area */
    #input-area {
      padding: 16px 24px 20px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    #input-wrap {
      max-width: 740px;
      margin: 0 auto;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      transition: border-color 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px 10px 16px;
    }
    #input-wrap:focus-within {
      border-color: #c4b8ac;
      box-shadow: 0 0 0 3px rgba(201,100,66,0.08);
    }
    #input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-primary);
      resize: none;
      min-height: 24px;
      max-height: 180px;
      line-height: 1.6;
      padding: 0;
    }
    #input::placeholder { color: var(--text-tertiary); }
    #send-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    #send-btn:hover { background: #b85a3a; }
    #send-btn:disabled { background: var(--border); cursor: default; }
    #input-hint {
      max-width: 740px;
      margin: 8px auto 0;
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
    }
  </style>
</head>
<body>
 
<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <div class="logo">A</div>
    <span>AI 助手</span>
  </div>
  <button id="new-chat-btn" onclick="newChat()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    新建对话
  </button>
  <div id="conv-list"></div>
  <div id="sidebar-footer">
    <div class="user-avatar">我</div>
    <span>个人账户</span>
  </div>
</div>
 
<!-- Main -->
<div id="main">
  <div id="header">
    <span style="font-size:14px;font-weight:500;color:var(--text-secondary)">对话</span>
    <div id="model-badge">
      <div class="dot"></div>
      Llama 4 Scout
    </div>
  </div>
 
  <div id="messages">
    <div id="welcome">
      <h1>你好，有什么可以帮你的？</h1>
      <p>我可以帮你解答问题、学习知识、分析问题或者一起讨论任何感兴趣的话题。</p>
      <div class="suggestions">
        <div class="sug-card" onclick="quick('用简单易懂的方式解释什么是人工智能')">
          <div class="sug-title">解释人工智能</div>
          <div class="sug-sub">用简单的语言讲清楚</div>
        </div>
        <div class="sug-card" onclick="quick('帮我出一道有趣的数学题')">
          <div class="sug-title">出题练习</div>
          <div class="sug-sub">锻炼思维，挑战自己</div>
        </div>
        <div class="sug-card" onclick="quick('推荐一些提高学习效率和记忆力的实用方法')">
          <div class="sug-title">学习方法</div>
          <div class="sug-sub">科学高效地学习</div>
        </div>
        <div class="sug-card" onclick="quick('帮我写一封礼貌的道歉邮件')">
          <div class="sug-title">写作帮助</div>
          <div class="sug-sub">各类文案、邮件、文章</div>
        </div>
      </div>
    </div>
  </div>
 
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="input" placeholder="发送消息..." rows="1"></textarea>
      <button id="send-btn" onclick="send()" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
    <div id="input-hint">按 Enter 发送 · Shift+Enter 换行</div>
  </div>
</div>
 
<script>
  let history = [];
  let busy = false;
  let convs = [{ id: 1, title: "新对话", active: true }];
  const msgsEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
 
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
    sendBtn.disabled = !inputEl.value.trim() || busy;
  });
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
 
  function quick(text) { inputEl.value = text; sendBtn.disabled = false; send(); }
 
  function newChat() {
    history = [];
    msgsEl.innerHTML = `<div id="welcome">
      <h1>你好，有什么可以帮你的？</h1>
      <p>我可以帮你解答问题、学习知识、分析问题或者一起讨论任何感兴趣的话题。</p>
      <div class="suggestions">
        <div class="sug-card" onclick="quick('用简单易懂的方式解释什么是人工智能')"><div class="sug-title">解释人工智能</div><div class="sug-sub">用简单的语言讲清楚</div></div>
        <div class="sug-card" onclick="quick('帮我出一道有趣的数学题')"><div class="sug-title">出题练习</div><div class="sug-sub">锻炼思维，挑战自己</div></div>
        <div class="sug-card" onclick="quick('推荐一些提高学习效率和记忆力的实用方法')"><div class="sug-title">学习方法</div><div class="sug-sub">科学高效地学习</div></div>
        <div class="sug-card" onclick="quick('帮我写一封礼貌的道歉邮件')"><div class="sug-title">写作帮助</div><div class="sug-sub">各类文案、邮件、文章</div></div>
      </div>
    </div>`;
  }
 
  function addUserMsg(text) {
    document.getElementById("welcome")?.remove();
    const row = document.createElement("div");
    row.className = "msg-row user";
    row.innerHTML = `<div class="user-bubble">${esc(text)}</div>`;
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
 
  function addAiMsg(text) {
    const row = document.createElement("div");
    row.className = "msg-row ai";
    row.innerHTML = `<div class="ai-avatar">A</div><div class="ai-content">${fmt(text)}</div>`;
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
 
  function showTyping() {
    const row = document.createElement("div");
    row.className = "msg-row ai"; row.id = "typing";
    row.innerHTML = `<div class="ai-avatar">A</div><div class="ai-content"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
 
  function fmt(t) {
    t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => `<pre><code>${esc(c.trim())}</code></pre>`);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/^### (.*)/gm, "<strong>$1</strong>");
    t = t.replace(/^## (.*)/gm, "<strong>$1</strong>");
    t = t.replace(/^- (.*)/gm, "• $1");
    const paras = t.split(/\n\n+/);
    return paras.map(p => p.trim() ? `<p>${p.replace(/\n/g, "<br>")}</p>` : "").join("");
  }
 
  function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
 
  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    inputEl.value = ""; inputEl.style.height = "auto";
    sendBtn.disabled = true; busy = true;
 
    addUserMsg(text);
    history.push({ role: "user", content: text });
    showTyping();
 
    // Update sidebar conv title
    if (history.length === 1) {
      document.querySelector(".conv-item.active").textContent = text.slice(0, 30) + (text.length > 30 ? "…" : "");
    }
 
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const d = await r.json();
      document.getElementById("typing")?.remove();
      const reply = d.reply || d.error || "出错了，请重试";
      addAiMsg(reply);
      history.push({ role: "assistant", content: reply });
    } catch {
      document.getElementById("typing")?.remove();
      addAiMsg("网络出错，请刷新后重试。");
    }
    busy = false;
    sendBtn.disabled = !inputEl.value.trim();
  }
 
  // Init sidebar
  function renderSidebar() {
    const list = document.getElementById("conv-list");
    list.innerHTML = convs.map(c => `<div class="conv-item ${c.active ? 'active' : ''}">${c.title}</div>`).join("");
  }
  renderSidebar();
</script>
</body>
</html>
