<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 学习助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #app { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 680px; height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    #header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #e8f4fd; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    #header h1 { font-size: 16px; font-weight: 600; color: #111; }
    #header p { font-size: 12px; color: #888; margin-top: 1px; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { display: flex; gap: 10px; max-width: 85%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .bubble { padding: 10px 15px; border-radius: 18px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .msg.ai .bubble { background: #f4f4f4; color: #111; border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: #1a73e8; color: #fff; border-bottom-right-radius: 4px; }
    .msg-av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
    .ai .msg-av { background: #e8f4fd; }
    .user .msg-av { background: #e8eaf6; }
    .typing { display: flex; gap: 4px; align-items: center; padding: 12px 16px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #aaa; animation: dot 1.2s infinite; display: inline-block; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 0%,60%,100%{opacity:.3;transform:scale(.8)} 30%{opacity:1;transform:scale(1)} }
    #chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 10px; }
    .chip { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #e0e0e0; color: #555; cursor: pointer; background: #fff; white-space: nowrap; }
    .chip:hover { background: #f5f5f5; }
    #bottom { padding: 12px 16px; border-top: 1px solid #f0f0f0; display: flex; gap: 10px; align-items: flex-end; }
    #input { flex: 1; resize: none; border: 1px solid #e0e0e0; border-radius: 20px; padding: 10px 16px; font-size: 14px; font-family: inherit; min-height: 42px; max-height: 120px; outline: none; line-height: 1.5; }
    #input:focus { border-color: #1a73e8; }
    #btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: #1a73e8; color: #fff; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #btn:hover { background: #1558c0; }
    #btn:disabled { background: #ccc; cursor: default; }
    pre { background: #f0f0f0; padding: 10px; border-radius: 8px; margin: 6px 0; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
    code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="avatar">🤖</div>
    <div>
      <h1>AI 学习助手</h1>
      <p>有任何问题都可以问我</p>
    </div>
  </div>
  <div id="messages">
    <div class="msg ai">
      <div class="msg-av">🤖</div>
      <div class="bubble">你好！我是你的 AI 学习助手 👋<br>可以问我任何问题，比如解释概念、帮你学编程、或者一起讨论感兴趣的话题！</div>
    </div>
  </div>
  <div id="chips">
    <button class="chip" onclick="quick('什么是人工智能？用简单的话解释')">什么是人工智能？</button>
    <button class="chip" onclick="quick('帮我解释一下 Python 是什么')">Python 入门</button>
    <button class="chip" onclick="quick('给我出一道数学题练练脑子')">出道题考我</button>
    <button class="chip" onclick="quick('推荐一些提高学习效率的方法')">学习方法</button>
  </div>
  <div id="bottom">
    <textarea id="input" placeholder="输入你的问题..." rows="1"></textarea>
    <button id="btn" onclick="send()">↑</button>
  </div>
</div>
<script>
  let history = [], busy = false;
  const msgs = document.getElementById("messages");
  const inp = document.getElementById("input");
  const btn = document.getElementById("btn");
  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  inp.addEventListener("input", () => { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 120) + "px"; });
  function quick(t) { inp.value = t; send(); }
  function addMsg(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const av = document.createElement("div"); av.className = "msg-av";
    av.textContent = role === "user" ? "我" : "🤖";
    const b = document.createElement("div"); b.className = "bubble";
    b.innerHTML = fmt(text);
    div.appendChild(av); div.appendChild(b);
    msgs.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
  }
  function fmt(t) {
    t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => `<pre>${esc(c.trim())}</pre>`);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/\n/g, "<br>"); return t;
  }
  function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function showTyping() {
    const d = document.createElement("div"); d.className = "msg ai"; d.id = "typing";
    d.innerHTML = '<div class="msg-av">🤖</div><div class="bubble typing"><span></span><span></span><span></span></div>';
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }
  async function send() {
    const text = inp.value.trim();
    if (!text || busy) return;
    inp.value = ""; inp.style.height = "auto";
    busy = true; btn.disabled = true;
    addMsg("user", text);
    history.push({ role: "user", content: text });
    showTyping();
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history }) });
      const d = await r.json();
      document.getElementById("typing")?.remove();
      const reply = d.reply || d.error || "出错了，请重试";
      addMsg("ai", reply); history.push({ role: "assistant", content: reply });
    } catch {
      document.getElementById("typing")?.remove();
      addMsg("ai", "网络出错，请刷新后重试 🙏");
    }
    busy = false; btn.disabled = false;
  }
</script>
</body>
</html>
